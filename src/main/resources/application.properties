# Elastic Beanstalk injects PORT. Falling back to 8080 keeps `mvn spring-boot:run` working locally.
server.port=${PORT:8080}

spring.application.name=thumbnailer
app.version=@project.version@

# Uploads are held in memory while they are resized, so cap them to keep memory use predictable.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
